<!DOCTYPE html>
<html>
  <head>
    <title>PDF Test</title>
  </head>
  <body>
    <h1>PDF Tester</h1>
    <p>This page tests various ways to access your PDF file.</p>

    <h2>Method 1: Direct backend access</h2>
    <iframe
      src="http://localhost:5000/uploads/pdfs/pdf-1741931885024.pdf"
      width="100%"
      height="300px"
    ></iframe>

    <h2>Method 2: Using object tag</h2>
    <object
      data="http://localhost:5000/uploads/pdfs/pdf-1741931885024.pdf"
      type="application/pdf"
      width="100%"
      height="300px"
    >
      <p>PDF cannot be displayed</p>
    </object>

    <h2>Method 3: Download link</h2>
    <a href="http://localhost:5000/uploads/pdfs/pdf-1741931885024.pdf" download
      >Download PDF</a
    >
  </body>
</html>
